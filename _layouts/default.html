<!DOCTYPE html>
<html>
{% include head.html %}

<body>
  {% include navbar.html %}
  {% include showcase.html %}
  {% include about.html %}
  {% include contact.html %}
  <!--Footer begins here-->
  {% include footer.html %}
</body>
<script>
  var navItems = document.getElementsByClassName('navbar-item');
  var heroes = document.getElementsByClassName('hero');
  var hero = document.getElementById('hero');
  var mobileHero = window.matchMedia('(max-width: 768px)');
  const viewOffset = 200; 

  function updateMobileHeroParallax() {
    if (!hero || !mobileHero.matches) {
      if (hero) {
        hero.style.removeProperty('--hero-parallax-y');
      }
      return;
    }

    var heroScroll = Math.max(0, window.scrollY - hero.offsetTop);
    var parallaxOffset = Math.min(heroScroll, hero.offsetHeight);
    hero.style.setProperty('--hero-parallax-y', parallaxOffset + 'px');
  }

  window.addEventListener("scroll", function (event) {
    var scroll = this.scrollY;
    var position = window.pageYOffset;

    for (var i = 0; i < navItems.length; i++) {
      navItems[i].classList.remove('is-active');
    }

    for (var i = 0; i < heroes.length; i++) {
        var sectionTop = heroes[i].offsetTop-viewOffset;
        var sectionBottom = heroes[i].offsetTop + heroes[i].offsetHeight-viewOffset;

        if (scroll >= sectionTop && scroll < sectionBottom) {
          navItems[i+1].classList.add('is-active');
      }
    }

    updateMobileHeroParallax();
  });

  window.addEventListener('resize', updateMobileHeroParallax);
  updateMobileHeroParallax();
</script>

</html>
